name: Backend CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

defaults:
  run:
    working-directory: ./backend

jobs:
  # =========================================================================
  # 1. BACKEND CODE QUALITY (ESLint, Prettier, TypeScript Strict Typecheck)
  # =========================================================================
  quality:
    name: Backend Quality (Lint, Format, Typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier code formatting check
        run: npm run format:check

      - name: ESLint check
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

  # =========================================================================
  # 2. BACKEND SECURITY SCANNING (Audit & Secret Scanning)
  # =========================================================================
  security:
    name: Backend Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: |
          npm audit --audit-level=high || echo "High/critical vulnerabilities noted. Review audit report."

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./backend
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

  # =========================================================================
  # 3. BACKEND UNIT & INTEGRATION TESTING MATRIX (Node 18.x, 20.x, 22.x)
  # =========================================================================
  test:
    name: Backend Tests (Node ${{ matrix.node-version }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Integration & Security Tests with Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          PORT: 8001
          JWT_SECRET: ci-test-jwt-secret-key-1234567890
          SUPABASE_URL: https://ci-mock.supabase.co
          SUPABASE_ANON_KEY: ci-mock-anon-key

      - name: Upload Test Coverage Artifact (Node 20)
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage/
          retention-days: 14

  # =========================================================================
  # 4. DATABASE MIGRATIONS INTEGRITY CHECK
  # =========================================================================
  migration-check:
    name: Database Migrations Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SQL migration file naming and content
        run: |
          echo "Checking SQL migration files in backend/migrations/..."
          for file in migrations/*.sql; do
            if [ -f "$file" ]; then
              echo "Validating migration: $file"
              # Ensure file is not empty
              if [ ! -s "$file" ]; then
                echo "Error: Migration $file is empty!"
                exit 1
              fi
            fi
          done
          echo "All SQL migration files passed naming and integrity checks."

  # =========================================================================
  # 5. BACKEND COMPILATION & BUILD JOB
  # =========================================================================
  build:
    name: Backend Build & Artifact
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript to JavaScript (tsc)
        run: npm run build

      - name: Verify build entrypoint exists
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "Error: dist/index.js was not generated by tsc build!"
            exit 1
          fi
          echo "Compiled backend entrypoint verified at dist/index.js."

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # =========================================================================
  # 6. DOCKER CONTAINER IMAGE BUILD CHECK
  # =========================================================================
  docker-check:
    name: Docker Container Build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: proviaa-backend:ci-test

  # =========================================================================
  # 7. BACKEND SUMMARY & NOTIFICATIONS
  # =========================================================================
  summary:
    name: Backend CI Summary
    needs: [quality, security, test, migration-check, build, docker-check]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Generate Pipeline Status Summary
        run: |
          echo "## 🛡️ Backend CI Pipeline Results for Commit \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch / Ref**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality (Lint, Format, Typecheck)**: ${{ needs.quality.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Scan**: ${{ needs.security.result == 'success' && '✅ Passed' || '⚠️ Completed with warnings' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Integration Tests**: ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Migration Checks**: ${{ needs.migration-check.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Production Build**: ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image**: ${{ needs.docker-check.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail workflow if critical jobs failed
        if: needs.quality.result != 'success' || needs.test.result != 'success' || needs.build.result != 'success'
        run: |
          echo "One or more critical backend CI stages failed. Merge blocked."
          exit 1
