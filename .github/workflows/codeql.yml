name: CodeQL Security Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 6 * * 1' # Runs every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis (JavaScript / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: +security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
        # For private repositories without a GitHub Advanced Security (GHAS) license,
        # continue-on-error prevents this step from blocking or failing the pipeline.
        continue-on-error: true

      - name: Upload SARIF Report as Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-report
          path: ../results/
          retention-days: 14
        continue-on-error: true
